minimumReleaseAge: 2880
# tsc-ts and its platform packages are Vercel Labs packages, exempt so the
# type-check can use a just-released tsc-ts.
minimumReleaseAgeExclude:
  - "@vercel/blob@2.8.1"
  - "tsc-ts"
  - "@tsc-ts/*"

allowBuilds:
  "@mongodb-js/zstd@7.0.0": false
  "@parcel/watcher@2.5.6": false
  "esbuild@0.27.4": false
  "esbuild@0.28.1": false
  "msw@2.12.13": false
  "node-liblzma@2.2.0": false
  "sharp@0.34.5": false
  "unrs-resolver@1.11.1": false

packages:
  - "packages/*"
  - "packages/@emulators/*"
  - "apps/*"
  - "examples/*"

patchedDependencies:
  next@16.3.4: patches/next@16.3.4.patch
